<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="-1" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#F75C7E"/>
      <stop offset="100%" stop-color="#A55EEA"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.6 0" to="0.6 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="50%" stop-color="#60EFFF"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="190" rx="24" fill="url(#bg)" stroke="#F75C7E" stroke-opacity="0.35" stroke-width="2"/>

  <line x1="40" y1="155" x2="960" y2="155" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 14">
    <animate attributeName="stroke-dashoffset" values="0;-88" dur="2.5s" repeatCount="indefinite"/>
  </line>

  <text x="500" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="60" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" letter-spacing="6">FARHAN</text>

  <text x="500" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="2">
    &lt;CSE @ University of Dhaka /&gt;
    <animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <circle cx="70" cy="148" r="7" fill="#4ECDC4">
    <animate attributeName="cy" values="160;136;160" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="148" r="7" fill="#FF6B6B">
    <animate attributeName="cy" values="136;160;136" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="40" r="4" fill="#A55EEA" opacity="0.7">
    <animate attributeName="cx" values="80;120;80" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="36" r="4" fill="#00FF87" opacity="0.7">
    <animate attributeName="cx" values="920;880;920" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="30" r="3" fill="#FFD166" opacity="0.6">
    <animate attributeName="cy" values="30;52;30" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="170" r="3" fill="#FFD166" opacity="0.6">
    <animate attributeName="cy" values="170;148;170" dur="4.4s" repeatCount="indefinite"/>
  </circle>
</svg>
