<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="50%" stop-color="#60EFFF"/>
      <stop offset="100%" stop-color="#F75C7E"/>
    </linearGradient>
  </defs>

  <line x1="60" y1="35" x2="440" y2="35" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <line x1="560" y1="35" x2="940" y2="35" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

  <g>
    <circle cx="500" cy="35" r="5" fill="#FFD166">
      <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="41" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8b949e" text-anchor="middle">Farhan Labib Ahan · farhanlabibahan</text>
  </g>

  <circle cx="100" cy="35" r="3" fill="#4ECDC4">
    <animate attributeName="cx" values="100;180;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="35" r="3" fill="#A55EEA">
    <animate attributeName="cx" values="900;820;900" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
